[package]
name = "assetflow"
version = "1.0.0"
description = "A local creative project organizer"
edition = "2021"

[lib]
name = "assetflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "8.2", default-features = false }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
strip = true
